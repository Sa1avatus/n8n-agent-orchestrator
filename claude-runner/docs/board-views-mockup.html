*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--panel2)}
button.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
input[type=search],input[type=text],select{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:5px 9px}
input[type=search]{min-width:170px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top h1{font-size:16px;font-weight:600;margin:0 8px 0 0}
.seg{display:flex;gap:4px;flex-wrap:wrap}.sp{flex:1}
.wrap{padding:14px 16px 40px}
.sub{color:var(--mut);font-size:12.5px;margin:0 0 10px}
.crumbs{font-size:13px;color:var(--mut);margin:0 0 10px}.crumbs a{color:var(--acc);cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);cursor:pointer}
.chip.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;font-weight:500}
.p-run{background:var(--runbg);color:var(--run)}.p-q{background:var(--panel2);color:var(--mut)}.p-ok{background:var(--okbg);color:var(--ok)}.p-bad{background:var(--badbg);color:var(--bad)}.p-off{background:var(--panel2);color:var(--faint)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--faint)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.sel{outline:2px solid var(--acc);outline-offset:-1px}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.kcol{background:var(--panel2);border-radius:12px;padding:10px;min-height:120px}
.kcol h3{font-size:12.5px;margin:0 0 8px;color:var(--mut);display:flex;justify-content:space-between;font-weight:600}
.kc{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:8px;padding:9px 10px;margin:0 0 8px;cursor:pointer;user-select:none}
.kc.run{border-left-color:var(--run)}.kc.ok{border-left-color:var(--ok)}.kc.bad{border-left-color:var(--bad)}
.kc.drop{outline:2px dashed var(--acc)}
.kc b{display:block;font-weight:600;font-size:13px}
.kc .proj{font-size:11px;color:var(--acc);background:var(--accbg);padding:0 6px;border-radius:5px;margin-right:4px}
.bar{height:5px;background:var(--line);border-radius:3px;margin:7px 0 5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--run)}
.ch{display:inline-block;font-size:11px;color:var(--mut);background:var(--panel2);border-radius:5px;padding:0 6px;margin:2px 3px 0 0}
.mv{float:right;display:flex;gap:2px}.mv button{padding:0 6px;font-size:12px;border-radius:5px}
.lane{display:grid;grid-template-columns:150px repeat(5,minmax(0,1fr));gap:6px;margin:0 0 8px}
.lane>div{background:var(--panel2);border-radius:8px;padding:6px;min-height:70px;min-width:0}
.lane .lh{background:transparent;padding:4px 2px}.lane .lh b{display:block;font-size:13px}
.lane.hd>div{background:transparent;min-height:0;text-align:center;font-size:12px;color:var(--mut);font-weight:600}
.lane .pend{max-height:230px;overflow:auto}
.n{border-radius:5px;padding:4px 7px;margin:0 0 5px;font-size:11.8px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n b{font-weight:600}.n .ts{display:block;font-size:11px;opacity:.8;font-family:ui-monospace,Consolas,monospace}.n small{opacity:.75;font-size:11px}
.n.y{background:var(--warnbg);color:var(--warn)}.n.b{background:var(--accbg);color:var(--acc)}.n.g{background:var(--okbg);color:var(--ok)}.n.r{background:var(--badbg);color:var(--bad)}.n.gr{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.n[draggable=true]{cursor:grab}.n.dropb{box-shadow:0 -3px 0 var(--acc)}.n.moved{outline:2px solid var(--warn)}.n.dep{outline:2px solid var(--acc)}
.warnbox{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 10px;margin:0 0 8px;font-size:12.5px}
.warnbox.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.warnbox button{margin:6px 6px 0 0;padding:3px 10px;font-size:12.5px}
.spr{display:grid;grid-template-columns:210px minmax(0,1fr) 250px;gap:12px;align-items:start}
.spr .col{background:var(--panel2);border-radius:12px;padding:10px}
.spr h3{font-size:12.5px;margin:0 0 8px;color:var(--mut);font-weight:600}
.bl{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:0 0 6px;font-size:12.5px;cursor:pointer}
.sb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kp{background:var(--panel2);border-radius:10px;padding:9px 11px;margin:0 0 8px}.kp span{display:block;color:var(--mut);font-size:11.5px}.kp b{font-size:20px;font-weight:600}
.imp{background:var(--badbg);color:var(--bad);border-radius:10px;padding:9px 11px;font-size:12.5px}
table.g{width:100%;border-collapse:collapse;font-size:13px}
table.g th{font-size:11.5px;color:var(--mut);text-align:left;font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap;user-select:none}
table.g td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.g tr.row{cursor:pointer}table.g tr.row:hover td{background:var(--panel2)}table.g tr.sel td{background:var(--accbg)}
.sg{display:flex;gap:2px;min-width:90px}.sg i{flex:1;height:10px;border-radius:2px;background:var(--line);min-width:3px}

.num{text-align:right;white-space:nowrap}
.pr{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;overflow:hidden}
.prh{display:grid;grid-template-columns:minmax(150px,1.4fr) minmax(160px,2fr) repeat(4,minmax(70px,.7fr)) 40px;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;user-select:none}
.prh b{font-size:14px}.prh .mono{display:block}
.pr.sel{outline:2px solid var(--acc);outline-offset:-2px;background:var(--accbg)}

.s-run{background:var(--run)}.s-q{background:var(--line2)}.s-ok{background:var(--ok)}.s-bad{background:var(--bad)}.s-off{background:var(--line)}

.prb{border-top:1px solid var(--line);padding:10px 14px;background:var(--panel2);display:none}
.pr.open .prb{display:block}.pr.open .arr{transform:rotate(90deg)}.arr{transition:transform .15s;padding:2px 8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:0 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left}
table.t th{font-size:11.5px;color:var(--mut);font-weight:600}
table.t tr.pend[draggable=true]{cursor:grab}table.t tr.dropb td{box-shadow:inset 0 3px 0 var(--acc)}table.t tr.moved td{background:var(--warnbg)}table.t tr.hl td{background:var(--accbg)}
.dp{display:inline-block;font-size:11px;padding:0 6px;border-radius:5px;background:var(--panel2);color:var(--mut);margin:0 3px 2px 0;cursor:pointer}
.dp:hover{background:var(--accbg);color:var(--acc)}
.rr{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;font-size:13px}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--accbg);color:var(--acc)}
.tr-row input[type=text]{width:100%}.tr-miss td{background:var(--warnbg)}
.tr-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
@media (max-width:900px){.kb{grid-template-columns:repeat(2,minmax(0,1fr))}.spr{grid-template-columns:1fr}.lane{grid-template-columns:110px repeat(5,minmax(110px,1fr));overflow-x:auto}.prh{grid-template-columns:1fr 1fr}.prh .stack{grid-column:1/-1}.prh .kpi{display:none}}
@media (max-width:520px){.kb{grid-template-columns:1fr}.top h1{width:100%}}
</style>

return '<div class="crumbs">'+backLink()+' / '+esc(t("runs.crumb"))+'</div><div class="chips"><span class="tag">'+esc(t("runs.filter",{id:m.id}))+' ✕</span><span class="mono">'+esc(t("runs.auto"))+'</span></div><div class="card">'+(rows.length?rows.map(function(r){return '<div class="rr"><span class="pill '+(r[1]==="running"?"p-run":"p-ok")+'">'+r[1]+'</span><b>'+esc(r[0])+'</b><span class="mono">'+r[2]+'</span></div>'}).join(""):'<div class="rr">'+esc(t("runs.empty"))+'</div>')+'</div>'}
function vTr(){var keys=Object.keys(I18N.en).sort(),miss=0;keys.forEach(function(k){if(!I18N[trLang]||!I18N[trLang][k])miss++});
return '<div class="crumbs">'+backLink()+' / <b>'+esc(t("tr.title"))+'</b></div><p class="sub">'+esc(t("tr.hint"))+'</p><div class="tr-bar"><label>'+esc(t("tr.lang"))+' <select id="trlang">'+LANGS.filter(function(l){return l.code!=="en"}).map(function(l){return '<option value="'+l.code+'"'+(l.code===trLang?" selected":"")+'>'+esc(l.name)+'</option>'}).join("")+'</select></label><label><input type="checkbox" id="trmiss"'+(trMissing?" checked":"")+'> '+esc(t("tr.missing"))+'</label><span class="sp"></span><input type="text" id="nlc" placeholder="'+esc(t("tr.code"))+'" size="8"><input type="text" id="nln" placeholder="'+esc(t("tr.name"))+'" size="16"><button id="nladd">'+esc(t("tr.add"))+'</button></div><p class="mono">'+esc(t("tr.saved",{n:miss,total:keys.length}))+'</p><div class="card" style="overflow-x:auto"><table class="t"><tr><th>'+esc(t("tr.key"))+'</th><th>'+esc(t("tr.en"))+'</th><th>'+esc(t("tr.tr"))+'</th></tr>'+keys.filter(function(k){return !trMissing||!(I18N[trLang]&&I18N[trLang][k])}).map(function(k){var has=I18N[trLang]&&I18N[trLang][k];return '<tr class="tr-row'+(has?"":" tr-miss")+'"><td class="mono">'+esc(k)+'</td><td>'+esc(I18N.en[k])+'</td><td><input type="text" data-k="'+esc(k)+'" value="'+esc(has||"")+'" placeholder="'+(has?"":esc(I18N.en[k]))+'"></td></tr>'}).join("")+'</table></div>'}

var R={proj:vProj,kan:vKan,lane:vLane,spr:vSpr,grid:vGrid,mission:vMission,runs:vRuns,tr:vTr};
var THEMES=["auto","light","dark"],th=0;
function chrome(){document.documentElement.lang=LANG;document.getElementById("title").textContent=t("app.title");document.title="AHAWR — "+t("app.title");document.getElementById("q").placeholder=t("search");
document.getElementById("theme").textContent=t("theme",{mode:t("theme."+THEMES[th])});document.getElementById("tr").textContent=t("tr.open");
document.getElementById("lang").innerHTML=LANGS.map(function(l){return '<option value="'+l.code+'"'+(l.code===LANG?" selected":"")+'>'+esc(l.name)+'</option>'}).join("")}
function draw(){chrome();document.getElementById("stage").innerHTML=R[cur]();var tab=(cur==="mission"||cur==="runs"||cur==="tr")?prev:cur;
document.getElementById("views").innerHTML=V.map(function(v){return '<button data-v="'+v+'" class="'+(v===tab&&cur!=="tr"?"on":"")+'" role="tab">'+esc(t("tab."+v))+'</button>'}).join("");
document.getElementById("projChips").innerHTML='<span class="chip'+(pf?"":" on")+'" data-pf="">'+esc(t("filter.all"))+'</span>'+Object.keys(PROJECTS).map(function(k){return '<span class="chip'+(pf===k?" on":"")+'" data-pf="'+k+'">'+esc(PROJECTS[k].name)+'</span>'}).join("");wire()}
function go(v,from){if(from)prev=from;cur=v;moved={};hl=null;draw()}
function wire(){var s=document.getElementById("stage");
[].forEach.call(s.querySelectorAll(".prh"),function(h){var p=h.parentNode.dataset.p;h.onclick=function(ev){selP=p;[].forEach.call(s.querySelectorAll(".pr"),function(x){x.classList.toggle("sel",x.dataset.p===p)});if(ev.target.closest(".arr")){openP[p]=!openP[p];h.parentNode.classList.toggle("open",openP[p])}};h.ondblclick=function(){pf=p;selP=p;go("kan")}});
[].forEach.call(s.querySelectorAll(".prb .kc"),function(e){e.onclick=function(ev){ev.stopPropagation();selM=e.dataset.m;[].forEach.call(s.querySelectorAll(".prb .kc"),function(x){x.classList.toggle("sel",x===e)})};e.ondblclick=function(ev){ev.stopPropagation();openM=e.dataset.m;go("mission","proj")}});
[].forEach.call(s.querySelectorAll(".kb .kc"),function(e){e.onclick=function(ev){if(ev.target.closest("button"))return;selM=e.dataset.id;[].forEach.call(s.querySelectorAll(".kb .kc"),function(x){x.classList.toggle("sel",x===e)})};e.ondblclick=function(ev){if(ev.target.closest("button"))return;runsFor=e.dataset.id;go("runs","kan")}});
[].forEach.call(s.querySelectorAll("tr.row"),function(e){e.onclick=function(){selM=e.dataset.m;[].forEach.call(s.querySelectorAll("tr.row"),function(x){x.classList.toggle("sel",x===e)})};e.ondblclick=function(){openM=e.dataset.m;go("mission","grid")}});
[].forEach.call(s.querySelectorAll("[data-sp]"),function(e){e.onclick=function(){selSprint=e.dataset.sp;[].forEach.call(s.querySelectorAll("[data-sp]"),function(x){x.classList.toggle("sel",x===e)})};e.ondblclick=function(){openM=e.dataset.sp;go("mission","spr")}});
[].forEach.call(s.querySelectorAll("th[data-s]"),function(e){e.onclick=function(){if(sortKey===e.dataset.s)sortDir*=-1;else{sortKey=e.dataset.s;sortDir=1}draw()}});
[].forEach.call(s.querySelectorAll("[data-back]"),function(e){e.onclick=function(){go(prev)}});
[].forEach.call(s.querySelectorAll("[data-runs]"),function(e){e.onclick=function(){runsFor=e.dataset.runs;go("runs",prev)}});
[].forEach.call(s.querySelectorAll("[data-dep]"),function(e){e.onclick=function(ev){ev.stopPropagation();var id=e.dataset.dep;hl=(hl&&hl[0]===id)?null:[id];draw()}});
[].forEach.call(s.querySelectorAll("[data-add]"),function(e){e.onchange=function(){var m=byId(openM),x=tk(m,e.dataset.add),dep=e.value;if(!dep)return;if(wouldCycle(m,x.id,dep)){msg["cyc"+m.id]={dep:dep,id:x.id}}else{x.deps.push(dep);msg["cyc"+m.id]=null;var order=pend(m).map(function(y){return y.id}),bad=violations(m,order);if(bad.length){var fixed=order.slice();bad.forEach(function(p){var a=fixed.indexOf(p[0]),b=fixed.indexOf(p[1]);if(a>b){fixed.splice(a,1);fixed.splice(b,0,p[0])}});applyOrder(m,fixed,bad.map(function(p){return p[0]}))}}draw()}});
[].forEach.call(s.querySelectorAll("[data-wc]"),function(e){e.onclick=function(){msg[e.dataset.wc]=null;draw()}});
[].forEach.call(s.querySelectorAll("[data-wg]"),function(e){e.onclick=function(){var id=e.dataset.wg,m=byId(id),w=msg[id];applyOrder(m,w.order,w.group);msg[id]=null;draw()}});
var mv=function(id,d){var qq=M.filter(function(m){return m.state==="q"}),i=qq.indexOf(byId(id)),j=i+d;if(j<0||j>=qq.length)return;var a=M.indexOf(qq[i]),b=M.indexOf(qq[j]),x=M[a];M[a]=M[b];M[b]=x;draw()};
[].forEach.call(s.querySelectorAll("[data-up]"),function(e){e.onclick=function(ev){ev.stopPropagation();mv(e.dataset.up,-1)}});
[].forEach.call(s.querySelectorAll("[data-dn]"),function(e){e.onclick=function(ev){ev.stopPropagation();mv(e.dataset.dn,1)}});
var drag=null;[].forEach.call(s.querySelectorAll('.kb .kc[draggable="true"]'),function(e){e.ondragstart=function(){drag=e.dataset.id};e.ondragover=function(ev){ev.preventDefault();e.classList.add("drop")};e.ondragleave=function(){e.classList.remove("drop")};e.ondrop=function(ev){ev.preventDefault();var from=byId(drag),to=byId(e.dataset.id);if(from&&to&&from!==to){M.splice(M.indexOf(from),1);M.splice(M.indexOf(to),0,from)}draw()}});
var dtask=null,dm=null;[].forEach.call(s.querySelectorAll('[data-tid][draggable="true"]'),function(e){var host=e.closest("[data-lane]"),mid=host?host.dataset.lane:openM;e.ondragstart=function(){dtask=e.dataset.tid;dm=mid;e.style.opacity=.5};e.ondragend=function(){e.style.opacity=1};e.ondragover=function(ev){if(dm===mid){ev.preventDefault();e.classList.add("dropb")}};e.ondragleave=function(){e.classList.remove("dropb")};e.ondrop=function(ev){ev.preventDefault();if(dm!==mid||!dtask||dtask===e.dataset.tid)return;var m=byId(mid),order=pend(m).map(function(y){return y.id});tryMove(m,dtask,order.indexOf(e.dataset.tid));draw()}});
var tl=document.getElementById("trlang");if(tl){tl.onchange=function(){trLang=tl.value;draw()};document.getElementById("trmiss").onchange=function(e){trMissing=e.target.checked;draw()};
[].forEach.call(s.querySelectorAll("input[data-k]"),function(i){i.onchange=function(){I18N[trLang]=I18N[trLang]||{};if(i.value.trim())I18N[trLang][i.dataset.k]=i.value;else delete I18N[trLang][i.dataset.k];draw()}});
document.getElementById("nladd").onclick=function(){var c=document.getElementById("nlc").value.trim().toLowerCase(),n=document.getElementById("nln").value.trim();if(!c||!n||LANGS.some(function(l){return l.code===c}))return;LANGS.push({code:c,name:n});I18N[c]={};trLang=c;draw()}}}
document.getElementById("views").onclick=function(e){var b=e.target.closest("button");if(b)go(b.dataset.v)};
document.getElementById("projChips").onclick=function(e){var c=e.target.closest(".chip");if(c){pf=c.dataset.pf;draw()}};
document.getElementById("q").oninput=function(e){qs=e.target.value.toLowerCase();draw()};
document.getElementById("lang").onchange=function(e){LANG=e.target.value;try{localStorage.setItem("ahawr-board-lang",LANG)}catch(x){}draw()};
document.getElementById("tr").onclick=function(){go("tr",(cur==="tr")?prev:(cur==="mission"||cur==="runs"?prev:cur))};
document.getElementById("theme").onclick=function(){th=(th+1)%3;var r=document.documentElement;if(th===0)r.removeAttribute("data-theme");else r.setAttribute("data-theme",THEMES[th]);draw()};
draw();
</script>
</body>
</html>
