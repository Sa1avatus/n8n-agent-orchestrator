<title>AHAWR</title>
<script>
(function () {
  try {
    const t = localStorage.getItem("ahawr-dashboard-theme");
    const el = document.documentElement;
    if (t === "light" || t === "dark") el.setAttribute("data-theme", t);
    else el.removeAttribute("data-theme"); // Auto
  } catch (e) { /* keep Auto */ }
  window.addEventListener("storage", (e) => {
    if (e.key !== "ahawr-dashboard-theme" || !e.newValue) return;
    try {
      const t = e.newValue;
      const el = document.documentElement;
      if (t === "light" || t === "dark") el.setAttribute("data-theme", t);
      else el.removeAttribute("data-theme");
    } catch (_) { /* ignore */ }
  });
})();
</script>
