<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHAWR Trajectory</title>
<script>
(function () {
  try {
    const t = localStorage.getItem("ahawr-dashboard-theme");
    const el = document.documentElement;
    if (t === "light" || t === "dark") el.setAttribute("data-theme", t);
    else el.removeAttribute("data-theme"); // Auto
  } catch (e) { /* keep Auto */ }
})();
</script>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f8fa; --panel: #ffffff; --ink: #1b2130; --muted: #6a7385; --faint: #687182;
  --line: #e6e8ee; --hover: #f2f4f8; --sel: #e9f0fd; --code: #f3f5f8; --accent: #2f6fde;
  --user: #2f6fde; --system: #6b7280; --init: #15803d; --think: #9b6bdc; --assistant: #6d3fc0;
  --tool: #c56a06; --ok: #16803c; --err: #d03b30; --retry: #b98900; --compact: #0f8f84;
  --model-wait: #cdbcf0; --model-gen: #8a5cd6; --tool-bar: #e0892a; --rag: #0e7490;
  --shadow: rgba(0,0,0,.15);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
:root[data-theme="light"] {
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1218; --panel: #161a22; --ink: #e3e7ee; --muted: #8e97a8; --faint: #a8b1c1;
    --line: #262c37; --hover: #1b2029; --sel: #1d2940; --code: #11151c; --accent: #6f9ef6;
    --user: #6f9ef6; --system: #9aa3b2; --init: #4cc27a; --think: #b99af2; --assistant: #a47ef0;
    --tool: #f0a24e; --ok: #4cc27a; --err: #f2766b; --retry: #e3b341; --compact: #3cc4b6;
    --model-wait: #4b3c70; --model-gen: #9b72ea; --tool-bar: #d9822a; --rag: #33bfd6;
    --shadow: rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1218; --panel: #161a22; --ink: #e3e7ee; --muted: #8e97a8; --faint: #a8b1c1;
  --line: #262c37; --hover: #1b2029; --sel: #1d2940; --code: #11151c; --accent: #6f9ef6;
  --user: #6f9ef6; --system: #9aa3b2; --init: #4cc27a; --think: #b99af2; --assistant: #a47ef0;
  --tool: #f0a24e; --ok: #4cc27a; --err: #f2766b; --retry: #e3b341; --compact: #3cc4b6;
  --model-wait: #4b3c70; --model-gen: #9b72ea; --tool-bar: #d9822a; --rag: #33bfd6;
  --shadow: rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { display: flex; background: var(--bg); color: var(--ink); font: 13.5px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
select, input[type=search] { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }
.mono { font-family: var(--mono); }

/* sidebar ------------------------------------------------------------ */
#side { width: 330px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); min-width: 0; }
#side header { padding: 12px 14px 8px; }
#side h1 { font-size: 15px; margin: 0 0 8px; font-weight: 650; letter-spacing: -.01em; }
#side h1 small { color: var(--muted); font-weight: 450; }
#theme { margin-top: 8px; }
#theme button { font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--muted); cursor: pointer; }
#theme button:hover { background: var(--hover); }
#theme button:active { background: var(--sel); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters select { flex: 1 1 90px; min-width: 0; font-size: 12px; padding: 3px 4px; }
#srcstate { font-size: 11.5px; color: var(--muted); margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
#srcstate .bad { color: var(--err); }
#sessionchip { margin-top: 6px; font-size: 12px; color: var(--muted); }
#sessionchip button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0 0 0 4px; }
#list { overflow-y: auto; flex: 1; border-top: 1px solid var(--line); }
.item { padding: 8px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover { background: var(--hover); }
.item.sel { background: var(--sel); }
.item .t { font-weight: 520; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .m { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.src { font: 600 10px/1 var(--mono); padding: 3px 5px; border-radius: 4px; letter-spacing: .03em; }
.src.claude-code { color: var(--assistant); background: color-mix(in srgb, var(--assistant) 12%, transparent); }
.src.hermes { color: var(--compact); background: color-mix(in srgb, var(--compact) 14%, transparent); }
.role { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; }
.role.architect { color: var(--user); } .role.worker { color: var(--tool); } .role.reviewer { color: var(--think); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.running, .dot.queued { background: var(--accent); animation: pulse 1.2s infinite; }
.dot.completed { background: var(--ok); } .dot.failed, .dot.interrupted { background: var(--err); } .dot.cancelled { background: var(--retry); }
@keyframes pulse { 50% { opacity: .25; } }

/* main --------------------------------------------------------------- */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#empty { margin: auto; color: var(--muted); }
#head { padding: 12px 18px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
#head h2 { margin: 0; font-size: 15.5px; font-weight: 620; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 5px; font-size: 12px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 520; }
.meta a { color: var(--accent); cursor: pointer; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.stat { border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px; font-size: 12px; color: var(--muted); background: var(--bg); }
.stat b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.exports { display: flex; gap: 6px; align-items: center; margin-left: auto; font-size: 12px; color: var(--muted); }
.exports a { color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: var(--bg); }
.exports a:hover { border-color: var(--accent); }
.stop { font: inherit; font-size: 12px; font-weight: 600; color: var(--err); background: var(--bg); border: 1px solid color-mix(in srgb, var(--err) 45%, var(--line)); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
.stop:hover { background: color-mix(in srgb, var(--err) 12%, var(--bg)); }
.stop:disabled { opacity: .55; cursor: default; }
.stat.none { color: var(--retry); border-color: color-mix(in srgb, var(--retry) 40%, var(--line)); }
.stat.rag b { color: var(--rag); }
table.chunks { width: 100%; border-collapse: collapse; font-size: 12px; }
table.chunks td, table.chunks th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.chunks th { color: var(--muted); font-weight: 600; }
table.chunks td.mono { overflow-wrap: anywhere; }
.errline { margin-top: 7px; color: var(--err); font-size: 12.5px; }
#toolbar { display: flex; gap: 8px; align-items: center; padding: 6px 18px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); }
#toolbar label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
#toolbar input[type=search] { margin-left: auto; width: 200px; }

/* overview timeline */
#overview { display: grid; grid-template-columns: 52px 1fr; gap: 3px 8px; padding: 8px 18px 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 10.5px; color: var(--faint); }
#overview .lane { position: relative; height: 10px; }
#overview .lab { text-align: right; line-height: 10px; }
.span { position: absolute; top: 1px; height: 8px; border-radius: 2px; min-width: 2px; cursor: pointer; }
.span:hover { outline: 1.5px solid var(--ink); z-index: 2; }
.span.in { background: var(--user); width: 3px; }
.span.wait { background: var(--model-wait); }
.span.gen { background: var(--model-gen); }
.span.tool { background: var(--tool-bar); }
.span.tool.err { background: var(--err); }
.span.run { background: repeating-linear-gradient(45deg, var(--tool-bar) 0 4px, transparent 4px 7px); }
.span.retry { background: var(--retry); width: 3px; }
.span.sel { outline: 2px solid var(--accent); z-index: 3; }
#axis { grid-column: 2; display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }

/* ledger */
#body { flex: 1; display: flex; min-height: 0; }
#ledger { flex: 1; overflow-y: auto; min-width: 0; }
.row { display: grid; grid-template-columns: 58px 50px 58px 84px 1fr; align-items: center; min-height: 28px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
.row > * { padding: 0 6px; min-width: 0; }
.gut { font: 10px var(--mono); color: var(--faint); white-space: nowrap; }
.gut .turn { color: var(--user); background: color-mix(in srgb, var(--user) 12%, transparent); border-radius: 3px; padding: 1px 4px; }
.off, .dur { font: 11px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dur.slow { color: var(--retry); } .dur.vslow { color: var(--err); }
.badge { justify-self: end; font: 650 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 4px; letter-spacing: .04em; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); white-space: nowrap; }
.sum { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 14px !important; }
.sum .arg { font: 12px var(--mono); color: var(--muted); }
.sum .arrow { color: var(--faint); margin: 0 5px; }
.sum .res { font: 12px var(--mono); }
.sum.think { color: var(--muted); font-style: italic; }
.k-prompt { --c: var(--user); } .k-user { --c: var(--user); } .k-init { --c: var(--init); } .k-system { --c: var(--system); }
.k-thinking { --c: var(--think); } .k-text { --c: var(--assistant); } .k-tool_use { --c: var(--tool); } .k-error { --c: var(--err); }
.k-rag { --c: var(--rag); } .k-retry { --c: var(--retry); } .k-compact { --c: var(--compact); } .k-result { --c: var(--ok); } .k-result.bad, .k-end.bad { --c: var(--err); } .k-end { --c: var(--ok); }
.steprow { display: grid; grid-template-columns: 58px 50px 58px 1fr; align-items: center; min-height: 22px; background: var(--bg); border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--muted); cursor: pointer; }
.steprow:hover { background: var(--hover); }
.steprow.sel { background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
.steprow > * { padding: 0 6px; }
.steprow .info { display: flex; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.steprow .info b { color: var(--ink); font-weight: 560; }
.sub .sum { padding-left: 20px !important; }
.sub .sum::before { content: "↳ subagent "; color: var(--faint); font-size: 11px; }
.liverow { margin: 8px 18px; border: 1px dashed var(--accent); border-radius: 8px; padding: 7px 10px; background: var(--panel); }
.liverow .lbl { font: 650 10.5px var(--mono); color: var(--accent); letter-spacing: .04em; text-transform: uppercase; }
.liverow .txt { white-space: pre-wrap; font-size: 12.5px; max-height: 180px; overflow-y: auto; margin-top: 3px; }
.liverow.thinking .txt { color: var(--muted); font-style: italic; }
.pulse { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; animation: pulse 1.2s infinite; }

/* inspector */
#insp { width: 440px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
#insp .ih { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
#insp .ih .where { font: 11px var(--mono); color: var(--muted); }
#insp .ih button { margin-left: auto; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px; }
.tabs { display: flex; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 8px 0; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.kv { display: grid; grid-template-columns: 118px 1fr; gap: 5px 10px; padding: 12px 14px; font-size: 12.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sect { padding: 4px 14px 12px; }
.sect h4 { margin: 8px 0 5px; font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
pre { margin: 0; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--code); border-radius: 6px; padding: 8px 10px; max-height: 60vh; overflow-y: auto; }
.prose { white-space: pre-wrap; font-size: 13px; }
.prose.think { color: var(--muted); font-style: italic; }
.del { color: var(--err); } .add { color: var(--ok); }
.bar { height: 8px; border-radius: 4px; background: var(--code); display: flex; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; }
/* Inline-style colors moved onto classes so they track the palette per theme */
.t-mut { color: var(--muted); } .t-acc { color: var(--accent); } .t-err { color: var(--err); }
.c-acc { background: var(--accent); } .c-ok { background: var(--ok); } .c-retry { background: var(--retry); }
@media (max-width: 1100px) { #insp { position: fixed; right: 0; top: 0; bottom: 0; box-shadow: -8px 0 24px var(--shadow); z-index: 10; max-width: 100vw; } }
@media (max-width: 760px) {
  body { flex-direction: column; overflow: auto; }
  #side { width: auto; max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .row { grid-template-columns: 44px 50px 76px 1fr; } .gut { display: none; }
  .steprow { grid-template-columns: 44px 50px 1fr; }
  .steprow .info { gap: 8px; }
  #toolbar input[type=search] { width: 120px; }
}
</style>
</head>
<body>
<aside id="side">
  <header>
    <h1>AHAWR <small>trajectory</small></h1>
    <div id="theme"><button id="themebtn" type="button" data-theme="auto" aria-label="Theme: Auto" title="Theme: Auto">Theme: Auto</button></div>
    <div class="filters">
      <select id="f-source" aria-label="Source"><option value="">sources</option><option value="claude-runner">Claude Code</option><option value="hermes">Hermes</option></select>
      <select id="f-role" aria-label="Role"><option value="">roles</option><option>architect</option><option>worker</option><option>reviewer</option><option>hermes</option><option>generic</option></select>
      <select id="f-status" aria-label="Status"><option value="">status</option><option>running</option><option>idle</option><option>completed</option><option>failed</option><option>interrupted</option><option>cancelled</option><option>queued</option></select>
    </div>
    <div id="sessionchip" hidden>session <b id="sessionid"></b><button id="sessionx" title="Clear">✕ clear</button></div>
    <div id="srcstate"></div>
  </header>
  <nav id="list"></nav>
</aside>
<main id="main"><div id="empty">Select a run.</div></main>
<script>
(function () {
  const KEY = "ahawr-dashboard-theme";
  const names = ["auto", "light", "dark"];
  const b = document.getElementById("themebtn");
  if (!b) return;
  const el = document.documentElement;
  function read() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }
  function persist(v) {
    try { v === "auto" ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, v); } catch (e) { /* ignore */ }
  }
  let cur = read() === "light" || read() === "dark" ? read() : "auto";
  const apply = (v) => { if (v === "auto") el.removeAttribute("data-theme"); else el.setAttribute("data-theme", v); };
  b.textContent = "Theme: " + cur[0].toUpperCase() + cur.slice(1);
  b.setAttribute("data-theme", cur);
  b.setAttribute("aria-label", "Theme: " + cur[0].toUpperCase() + cur.slice(1));
  b.setAttribute("title", "Theme: " + cur[0].toUpperCase() + cur.slice(1));
  b.onclick = () => {
    cur = names[(names.indexOf(cur) + 1) % 3];
    apply(cur); persist(cur);
    b.textContent = "Theme: " + cur[0].toUpperCase() + cur.slice(1);
    b.setAttribute("data-theme", cur);
    b.setAttribute("aria-label", "Theme: " + cur[0].toUpperCase() + cur.slice(1));
    b.setAttribute("title", "Theme: " + cur[0].toUpperCase() + cur.slice(1));
  };
  // the timeline lanes are CSS-painted, so no redraw is needed on theme change;
  // if canvas-drawn charts are added later, read the palette via
  // getComputedStyle(document.documentElement).getPropertyValue("--...") and
  // repaint on this toggle and on matchMedia("(prefers-color-scheme: dark)").change
})();
</script>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const S = { runs: [], sel: null, run: null, entries: [], next: 0, live: null, pick: null, tab: "summary",
  session: "", known: null, timer: 0, show: { thinking: true, system: true }, q: "", model: null };

// ---------------------------------------------------------------- formatting
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tok = (n) => n == null || isNaN(n) ? "–" : n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e4 ? (n / 1e3).toFixed(1) + "K" : n >= 1e3 ? (n / 1e3).toFixed(2) + "K" : String(Math.round(n));
function ms(v) {
  if (v == null || isNaN(v)) return "";
  if (v < 1000) return Math.round(v) + "ms";
  const s = v / 1000;
  if (s < 60) return s.toFixed(s < 10 ? 2 : 1) + "s";
  return Math.floor(s / 60) + "m" + String(Math.round(s % 60)).padStart(2, "0") + "s";
}
const clock = (t) => t ? new Date(t * 1000).toLocaleTimeString([], { hour12: false }) + "." + String(Math.floor((t % 1) * 1000)).padStart(3, "0") : "–";
const epoch = (iso) => iso ? Date.parse(iso) / 1000 : null;
function ago(iso) {
  const t = epoch(iso); if (!t) return "";
  const s = Math.max(0, Date.now() / 1000 - t);
  return s < 60 ? Math.round(s) + "s" : s < 3600 ? Math.round(s / 60) + "m" : s < 86400 ? Math.round(s / 3600) + "h" : Math.round(s / 86400) + "d";
}
// replace a container's HTML only when it changed (keeps scroll and text selection)
function setHTML(el, html) { if (el._html !== html) { el.innerHTML = html; el._html = html; } }
const oneLine = (s, n = 400) => String(s ?? "").replace(/\s+/g, " ").trim().slice(0, n);
const isActive = (r) => r && (r.status === "running" || r.status === "queued");
async function getJSON(url) {
  const res = await fetch(url, { cache: "no-store" });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.status);
  return body;
}

// ---------------------------------------------------------------- run list
async function loadRuns() {
  const q = new URLSearchParams({ limit: "150" });
  for (const [k, id] of [["source", "#f-source"], ["role", "#f-role"], ["status", "#f-status"]]) if ($(id).value) q.set(k, $(id).value);
  if (S.session) q.set("session_id", S.session);
  let data;
  try { data = await getJSON("api/runs?" + q); } catch (e) { $("#srcstate").innerHTML = `<span class="bad">dashboard offline: ${esc(e.message)}</span>`; return; }
  $("#srcstate").innerHTML = Object.entries(data.sources || {}).map(([k, v]) => `<span class="${v === "ok" ? "" : "bad"}">${esc(k)}: ${esc(v)}</span>`).join("");
  const ids = new Set(data.runs.map((r) => r.run_id));
  if (S.known && !S.session) {
    const fresh = data.runs.find((r) => !S.known.has(r.run_id));
    if (fresh && (!S.run || !isActive(S.run))) select(fresh.run_id);  // follow a run that just started
  }
  S.known = ids;
  S.runs = data.runs;
  renderList();
}
function renderList() {
  $("#list").innerHTML = S.runs.length ? S.runs.map((r) => `
    <div class="item ${r.run_id === S.sel ? "sel" : ""}" data-id="${esc(r.run_id)}">
      <div class="t">${esc(r.kind === "compact" ? "/compact" : r.title || r.run_id)}</div>
      <div class="m"><span class="dot ${esc(r.status)}"></span><span class="src ${esc(r.source)}">${r.source === "hermes" ? "HERMES" : "CLAUDE"}</span>
        <span class="role ${esc(r.role)}">${esc(r.role)}</span><span>${esc(r.model || "")}${r.provider && r.provider !== "hermes" ? " · " + esc(r.provider) : ""}</span>
        <span>${esc(ago(r.updated_at || r.created_at))}</span></div>
    </div>`).join("") : '<div class="item" style="cursor:default" class="t-mut">No runs yet.</div>';
}
$("#list").addEventListener("click", (e) => { const it = e.target.closest(".item[data-id]"); if (it) select(it.dataset.id); });

  const kv = (pairs) => `<dl class="kv">${pairs.filter((p) => p[1] !== "" && p[1] != null).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;
  if (S.pick.startsWith("r")) {
    const b = (m.rags || {})[S.pick];
    if (!b) { box.hidden = true; return; }
    head = `<span class="badge k-rag">RAG</span><span class="where">request ${esc(b.request)} · profile ${esc(b.profile)}</span>`;
    tabs = ["summary", "context"];
    if (S.tab === "summary") body = kv([["Chunks", b.chunks.length], ["Context size", tok(b.chars) + " chars"], ["Request id", `<span class="mono">${esc(b.request)}</span>`]]) +
      `<div class="sect"><table class="chunks"><tr><th>#</th><th>Source</th><th>Location</th><th>Score</th></tr>${b.chunks.map((c, i) => `<tr><td>${i + 1}</td><td>${esc(c.authority)}${c.freshness ? `<br><span class="t-mut">${esc(c.freshness)}</span>` : ""}</td><td class="mono">${esc(c.path)}:${esc(c.lines)}${c.symbol ? `<br>${esc(c.symbol)}` : ""}${c.section ? `<br>${esc(c.section)}` : ""}</td><td>${esc(c.score || "")}</td></tr>`).join("")}</table></div>`;
    else body = `<div class="sect"><pre>${esc(b.body)}</pre></div>`;
  } else if (S.pick.startsWith("s")) {
    const n = Number(S.pick.slice(1)), s = m.steps[n] || { step: n };
    const blocks = S.entries.filter((e) => e.step === n && !e.agent);
    head = `<span class="badge k-text">STEP</span><span class="where">Turn ${blocks[0] ? blocks[0]._turn : "?"} · Request #${n}</span>`;
    tabs = ["summary", "content", "raw"];
    const totalIn = (s.input_tokens || 0) + (s.cache_read_tokens || 0) + (s.cache_write_tokens || 0);
    const bar = totalIn ? `<div class="bar" title="cache read / cache write / uncached"><i style="width:${(s.cache_read_tokens || 0) / totalIn * 100}%" class="c-ok"></i><i style="width:${(s.cache_write_tokens || 0) / totalIn * 100}%" class="c-retry"></i><i style="flex:1" class="c-acc"></i></div>` : "";
    if (S.tab === "summary") body = kv([
      ["Model", esc(s.model || S.run.model || "")],
      ["Status", s.duration_ms != null || s.approximate ? "completed" : "generating"],
      ["Input tokens", totalIn ? `${tok(totalIn)}${bar}` : ""],
      ["  uncached", s.input_tokens != null && totalIn ? tok(s.input_tokens) : ""],
      ["  cache read", s.cache_read_tokens ? tok(s.cache_read_tokens) : ""],
      ["  cache write", s.cache_write_tokens ? tok(s.cache_write_tokens) : ""],
      ["Output tokens", tok(s.output_tokens)],
      ["Finish", esc(s.finish_reason || "")],
      ["Started", s.started ? clock(s.started) : ""],
      ["Total duration", s.duration_ms != null ? (s.approximate ? "≈ " : "") + ms(s.duration_ms) : ""],
      ["TTFT", s.ttft_ms != null ? ms(s.ttft_ms) : ""],
      ["Generation", s.generation_ms != null ? ms(s.generation_ms) : ""],
      ["Throughput", s.tokens_per_s ? s.tokens_per_s + " tok/s" : ""],
    ]) + (s.approximate ? `<div class="sect t-mut" style="font-size:12px">Hermes stores when each message was written, so a step is timed from the previous message to the answer.</div>` : "");
    else if (S.tab === "content") body = blocks.map((b) => b.kind === "thinking" ? `<div class="sect"><h4>Thinking</h4><div class="prose think">${esc(b.text)}</div></div>` : b.kind === "text" ? `<div class="sect"><h4>Answer</h4><div class="prose">${esc(b.text)}</div></div>` : `<div class="sect"><h4>Tool call · ${esc(b.name)}</h4><pre>${esc(JSON.stringify(b.input, null, 2))}</pre></div>`).join("") || `<div class="sect">No content.</div>`;
    else body = `<div class="sect"><pre>${esc(JSON.stringify({ step: s, blocks }, null, 2))}</pre></div>`;
  } else {
    const seq = Number(S.pick.slice(1)), e = S.entries.find((x) => x.seq === seq);
    if (!e) { box.hidden = true; return; }
    const [cls, label] = badgeFor(e, m.tools);
    head = `<span class="badge ${cls}">${label}</span><span class="where">Turn ${e._turn || 0}${e.step ? " · Step " + e.step : ""}${e.agent ? " · subagent" : ""}</span>`;
    if (e.kind === "tool_use") {
      const r = (m.tools[e.id] || {}).result;
      tabs = ["summary", "payload", "result", "raw"];
      const end = r ? r.t : null;
      if (S.tab === "summary") body = kv([
        ["Tool", `<span class="mono">${esc(e.name)}</span>`],
        ["Status", r ? (r.is_error ? `<span class="t-err">error</span>` : "completed") : "running"],
        ["Started", clock(e.t)], ["Duration", end ? ms((end - e.t) * 1000) : ms((Date.now() / 1000 - e.t) * 1000) + " (running)"],
        ["Call id", `<span class="mono">${esc(e.id)}</span>`],
      ]) + `<div class="sect"><h4>Payload</h4>${toolPayload(e)}</div>` + (r ? `<div class="sect"><h4>Result · ${String(r.preview || r.text || "").split("\n").length} lines</h4><pre>${esc(pretty(r))}</pre></div>` : "");
      else if (S.tab === "payload") body = `<div class="sect"><pre>${esc(JSON.stringify(e.input, null, 2))}</pre></div>`;
      else if (S.tab === "result") body = `<div class="sect">${r ? `<pre>${esc(r.text)}</pre>` : "Still running."}</div>`;  // exact text
      else body = `<div class="sect"><pre>${esc(JSON.stringify({ call: e, result: r }, null, 2))}</pre></div>`;
    } else {
      tabs = ["summary", "raw"];
      if (S.tab === "summary") {
        const step = e.step ? m.steps[e.step] : null;
        body = kv([
          ["Time", clock(e.t)],
          ["Step", step ? `#${e.step} · ${ms(step.duration_ms)}${step.output_tokens ? " · out " + tok(step.output_tokens) : ""}` : ""],
          e.kind === "result" ? ["Turns", e.num_turns] : ["", ""],
          e.kind === "result" ? ["Cost", e.cost_usd != null ? "$" + Number(e.cost_usd).toFixed(4) : ""] : ["", ""],
          e.kind === "result" ? ["Duration", ms(e.duration_ms) + (e.duration_api_ms ? ` (API ${ms(e.duration_api_ms)})` : "")] : ["", ""],
          e.kind === "end" ? ["Status", esc(e.status)] : ["", ""],
        ]) + `<div class="sect"><div class="prose ${e.kind === "thinking" ? "think" : ""}">${esc(e.text || e.error || summaryText(e))}</div></div>` +
          (e.kind === "result" && e.model_usage ? `<div class="sect"><h4>Usage by model</h4><pre>${esc(JSON.stringify(e.model_usage, null, 2))}</pre></div>` : "") +
          (e.stderr_tail ? `<div class="sect"><h4>stderr</h4><pre>${esc(e.stderr_tail)}</pre></div>` : "");
      } else body = `<div class="sect"><pre>${esc(JSON.stringify(e, null, 2))}</pre></div>`;
    }
  }
  if (!tabs.includes(S.tab)) S.tab = tabs[0];
  setHTML(box, `<div class="ih">${head}<button title="Close" data-close>✕</button></div>
    <div class="tabs">${tabs.map((t) => `<button class="${t === S.tab ? "on" : ""}" data-tab="${t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}</div>${body}`);
  box.onclick = (ev) => {
    const tb = ev.target.closest("[data-tab]");
    if (tb) { S.tab = tb.dataset.tab; renderInspector(S.model); }
    if (ev.target.closest("[data-close]")) { S.pick = null; render(); }
  };
}
// a JSON tool result (Hermes) reads better as its main field plus the rest, pretty-printed
function pretty(r) {
  if (!r.preview) return r.text;
  try { const o = JSON.parse(r.text); for (const k of ["output", "content", "result"]) if (o[k] === r.preview) { delete o[k]; break; } return r.preview + "\n\n" + JSON.stringify(o, null, 2); } catch (_) { return r.text; }
}
function summaryText(e) { const d = document.createElement("div"); d.innerHTML = summaryHTML(e, (S.model || {}).tools || {}); return d.textContent; }
function toolPayload(e) {
  const i = e.input && typeof e.input === "object" ? e.input : {};
  const diff = (a, b) => `<pre>${String(a ?? "").split("\n").map((l) => `<span class="del">- ${esc(l)}</span>`).join("\n")}\n${String(b ?? "").split("\n").map((l) => `<span class="add">+ ${esc(l)}</span>`).join("\n")}</pre>`;
  if ("old_string" in i || "new_string" in i) return `<div class="mono" style="margin-bottom:4px">${esc(i.file_path || i.path || "")}</div>` + diff(i.old_string, i.new_string);
  if (Array.isArray(i.edits)) return i.edits.map((x) => diff(x.old_string, x.new_string)).join("");
  if (Array.isArray(i.todos)) return `<pre>${i.todos.map((t) => `${t.status === "completed" ? "☑" : t.status === "in_progress" ? "▶" : "☐"} ${esc(t.content ?? t.activeForm ?? "")}`).join("\n")}</pre>`;
  if (i.command) return `<pre>$ ${esc(i.command)}</pre>`;
  return `<pre>${esc(JSON.stringify(e.input, null, 2))}</pre>`;
}

// ---------------------------------------------------------------- start
function fromHash() { const m = location.hash.match(/run=([^&]+)/); if (m) select(decodeURIComponent(m[1])); }
window.addEventListener("hashchange", fromHash);
(async () => {
  await loadRuns();
  fromHash();
  if (!S.sel && S.runs[0]) select(S.runs[0].run_id);
  setInterval(loadRuns, 3000);
})();
</script>
</body>
</html>
