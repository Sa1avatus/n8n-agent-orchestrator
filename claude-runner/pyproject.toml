[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-runner"
version = "0.11.920"
description = "Hermes-compatible run API (/v1/runs) that executes AHAWR roles with the Claude Code CLI"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "cryptography>=42,<50",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML>=6,<7"]
qa =["pyyaml>=6,<7", "playwright>=1.45,<2"]

[project.scripts]
claude-runner = "claude_runner.__main__:main"
ahawr-dashboard = "claude_runner.dashboard:main"
ahawr-search = "claude_runner.search_cli:main"
ahawr-mcp-search = "claude_runner.mcp_search:main"
ahawr-mcp-board = "claude_runner.mcp_board:main"
ahawr-dashboard-hash-password = "claude_runner.dashboard_auth_crypto:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_runner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=claude_runner --cov-report=term-missing --cov-fail-under=80"
anyio_mode = "auto"
markers = ["qa_integration: runs the throwaway QA stack; needs Docker, Playwright and Chromium"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["playwright", "playwright.*", "yaml", "yaml.*"]
ignore_missing_imports = true
