[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-runner"
version = "0.2.0"
description = "Hermes-compatible run API (/v1/runs) that executes AHAWR roles with the Claude Code CLI"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
claude-runner = "claude_runner.__main__:main"
ahawr-dashboard = "claude_runner.dashboard:main"
ahawr-search = "claude_runner.search_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_runner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=claude_runner --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
