# Routes the QA scenarios reach. Paths in scenario_refs are relative to claude-runner/qa/scenarios.
# Route lines are relative to claude-runner/src/claude_runner/.
#
# Matching: qa_runner._is_2xx checks `path in url`, so a scenario that names /api/board is
# satisfied by any 2xx under /api/board. The GET entries below name the concrete routes the
# board loads (board_actions.js:66-67 fetches /api/board/missions and /api/board/queue).
#
# non_empty applies to the default fixture. The views_open_empty_database scenarios only
# require a 2xx on the same paths.
#
# url_fields: none of the GET routes below returns a url field. The one url field in the
# API (board_api.py:535, screenshot url) belongs to GET /api/board/missions/{mission_id}/qa,
# which no scenario reaches (board-qa-panel.yaml:6-7).
#
# GET /api/board/missions/{mission_id} is not listed: its only scenario reference is the save
# (POST, see settings_launch_window.yaml:1-2 and save_validation_error_then_persist.yaml:78).
#
# Mutations: every POST/PUT/DELETE under /api/board needs the X-AHAWR-Dashboard header.
# dashboard.py:143-152 (board_header_guard) returns 403 before routing, so the 403 expectation
# holds for any placeholder value.

fixture_ids:
  mission_id: "m01"
  state_key: "sk_m01"
  task_key: "T001"
  flag_key: "queue_paused"
  changelog_id: 1
  template_name: "qa-template"
  lang: "en"
  i18n_key: "qa-key"
  run_id: "qa-run"

