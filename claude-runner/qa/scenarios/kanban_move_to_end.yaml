name: kanban queued card dropped below the last card moves to the end
tags: [ui, queue]
preconditions:
  fixture: default
steps:
  - open: /static/board.html#board/view/kan
    expect:
      text_visible: [Kanban]
      order: [Never started, Queued with status, Waiting in line]
      request_2xx: [/api/board]
  - drag:
      from: Never started
      onto: Waiting in line
      below: true
    expect:
      order: [Queued with status, Waiting in line, Never started]
      request_2xx: [/api/board/queue/move]
      no_console_error: true
      no_mutation_without_header: true
