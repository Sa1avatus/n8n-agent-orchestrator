<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-label="How a mission runs"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17191f"/><stop offset="1" stop-color="#2b2113"/></linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffc766"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3a9b8"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b39bff"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5cc98b"/></marker></defs>
<rect width="1100" height="310" rx="18" fill="#17191f"/><rect x="1" y="1" width="1098" height="308" rx="17" fill="none" stroke="#33384a"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle"><rect x="30" y="40" width="170" height="62" rx="14" fill="#20232b" stroke="#6aa8ff" stroke-width="2"/><text x="115.0" y="69.0" fill="#6aa8ff" font-size="17" font-weight="700">Missions</text><text x="115.0" y="88.0" fill="#a3a9b8" font-size="12.5" font-weight="400">queue, rules, criteria</text><rect x="235" y="40" width="170" height="62" rx="14" fill="#20232b" stroke="#ffb454" stroke-width="2"/><text x="320.0" y="69.0" fill="#ffb454" font-size="17" font-weight="700">Architect</text><text x="320.0" y="88.0" fill="#a3a9b8" font-size="12.5" font-weight="400">small tasks</text><rect x="440" y="40" width="170" height="62" rx="14" fill="#20232b" stroke="#ff8a3d" stroke-width="2"/><text x="525.0" y="69.0" fill="#ff8a3d" font-size="17" font-weight="700">Worker</text><text x="525.0" y="88.0" fill="#a3a9b8" font-size="12.5" font-weight="400">builds one task</text><rect x="645" y="40" width="170" height="62" rx="14" fill="#20232b" stroke="#b39bff" stroke-width="2"/><text x="730.0" y="69.0" fill="#b39bff" font-size="17" font-weight="700">Reviewer</text><text x="730.0" y="88.0" fill="#a3a9b8" font-size="12.5" font-weight="400">score and verdict</text><rect x="850" y="40" width="170" height="62" rx="14" fill="#20232b" stroke="#5cc98b" stroke-width="2"/><text x="935.0" y="69.0" fill="#5cc98b" font-size="17" font-weight="700">Result</text><text x="935.0" y="88.0" fill="#a3a9b8" font-size="12.5" font-weight="400">report, notices</text><g stroke="#a3a9b8" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M200 71H233" marker-end="url(#a)"/><path d="M405 71H438" marker-end="url(#a)"/><path d="M610 71H643" marker-end="url(#a)"/><path d="M815 71H848" stroke="#5cc98b" marker-end="url(#g)"/><path d="M730 102V150H525V104" stroke="#b39bff" stroke-dasharray="6 5" marker-end="url(#b)"/></g><text x="628" y="144" fill="#b39bff" font-size="12.5" font-weight="600">retry with the review</text><rect x="292" y="116" width="140" height="50" rx="14" fill="#20232b" stroke="#4fd1c5" stroke-width="2"/><text x="362.0" y="139.0" fill="#4fd1c5" font-size="17" font-weight="700">Retrieval</text><text x="362.0" y="158.0" fill="#a3a9b8" font-size="12.5" font-weight="400">context for the roles</text><path d="M432 141H452V104" stroke="#4fd1c5" stroke-width="2" stroke-dasharray="3 4" fill="none" marker-end="url(#a)"/><rect x="30" y="206" width="250" height="56" rx="12" fill="#1b1e26" stroke="#33384a"/><rect x="30" y="206" width="6" height="56" rx="3" fill="#eceef3"/><text x="50" y="229" text-anchor="start" fill="#eceef3" font-size="14" font-weight="700">n8n: the axis</text><text x="50" y="248" text-anchor="start" fill="#a3a9b8" font-size="11.5" font-weight="500">the loop, queue, retries, state</text><rect x="292" y="206" width="250" height="56" rx="12" fill="#1b1e26" stroke="#33384a"/><rect x="292" y="206" width="6" height="56" rx="3" fill="#a3a9b8"/><text x="312" y="229" text-anchor="start" fill="#eceef3" font-size="14" font-weight="700">claude-runner</text><text x="312" y="248" text-anchor="start" fill="#a3a9b8" font-size="11.5" font-weight="500">runs the roles, sessions</text><rect x="554" y="206" width="250" height="56" rx="12" fill="#1b1e26" stroke="#33384a"/><rect x="554" y="206" width="6" height="56" rx="3" fill="#a3a9b8"/><text x="574" y="229" text-anchor="start" fill="#eceef3" font-size="14" font-weight="700">Models</text><text x="574" y="248" text-anchor="start" fill="#a3a9b8" font-size="11.5" font-weight="500">local and cloud</text><rect x="816" y="206" width="250" height="56" rx="12" fill="#1b1e26" stroke="#33384a"/><rect x="816" y="206" width="6" height="56" rx="3" fill="#a3a9b8"/><text x="836" y="229" text-anchor="start" fill="#eceef3" font-size="14" font-weight="700">Dashboard + Telegram</text><text x="836" y="248" text-anchor="start" fill="#a3a9b8" font-size="11.5" font-weight="500">runs, mission board, notices</text><text x="550" y="296" fill="#a3a9b8" font-size="12.5">the loop runs in n8n; every role runs through claude-runner</text></g></svg>
