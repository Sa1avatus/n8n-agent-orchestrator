="#ff8a3d"/><text x="268" y="153" fill="#ff8a3d" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Worker</text><text x="268" y="165" fill="#a3a9b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500">builds one task at a time</text><rect x="250" y="175" width="320" height="31" rx="10" fill="#1b1e26" stroke="#33384a"/><rect x="250" y="175" width="6" height="31" rx="3" fill="#b39bff"/><text x="268" y="188" fill="#b39bff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Reviewer</text><text x="268" y="200" fill="#a3a9b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500">scores the result: retry with the review, or next task</text><rect x="250" y="210" width="320" height="31" rx="10" fill="#1b1e26" stroke="#33384a"/><rect x="250" y="210" width="6" height="31" rx="3" fill="#5cc98b"/><text x="268" y="223" fill="#5cc98b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Result</text><text x="268" y="235" fill="#a3a9b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500">the report for the operator</text></g></svg>
