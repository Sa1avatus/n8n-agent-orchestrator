<text x="64" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#a3a9b8">Missions in, reviewed code out.</text>
<text x="64" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#a3a9b8">n8n drives the loop, claude-runner runs the models.</text>
