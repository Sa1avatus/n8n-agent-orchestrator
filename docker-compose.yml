services:
  # n8n database (2026-10-12): SQLite on the Windows bind-mount ended executions with SQLITE_BUSY. The data lives in a
  # Docker volume (ext4 inside WSL); scripts reach it with `docker exec ahawr-postgres psql ...` (no published port).
  ahawr-postgres:
    image: postgres:16-alpine
    container_name: ahawr-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_DB=n8n
      - POSTGRES_PASSWORD=${N8N_PG_PASSWORD}
    volumes:
      - ahawr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]

  n8n:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: n8n-autonomous-agents
    restart: unless-stopped

    # Public resolvers for external names (api.telegram.org): the host/WSL resolver answered EAI_AGAIN now and then.
    # Container names (claude-runner, ...) are still answered by Docker's own DNS.
    dns:
      - 1.1.1.1
      - 8.8.8.8

    ports:
      - "5678:5678"

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      - N8N_SECURE_COOKIE=false
      - NODES_EXCLUDE=[]
      # database: Postgres (ahawr-postgres), not the SQLite file in the bind-mount; the encryption key stays in ~/.n8n/config
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=ahawr-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_PG_PASSWORD}

    volumes:
      - D:\n8n\data:/home/node/.n8n
      - D:\n8n\scripts:/home/node/scripts

    depends_on:
      ahawr-postgres:
        condition: service_healthy
      ahawr-retrieval:
        condition: service_started
        # AHAWR is fail-open: n8n still starts if the retrieval container is absent.
        required: false

  # AHAWR Context Retrieval Layer: its own container inside this stack. n8n reaches it at
  # http://ahawr-retrieval:8500 over the stack network; no port is published to the host.
  ahawr-retrieval:
    build:
      context: ./retrieval-service
      dockerfile: Dockerfile

    container_name: ahawr-retrieval
    restart: unless-stopped

    # RETRIEVAL_* settings and secrets (reranker, embeddings, rag-platform). See .env.example.
    env_file:
      - path: .env
        required: false

    environment:
      - RETRIEVAL_DATA_DIR=/data
      - MALLOC_ARENA_MAX=2
      - RETRIEVAL_ALLOWED_ROOTS=/workspace,/d
      # sync corpora in the background; a request waits for it at most this long, then answers from the current index
      # (2026-10-13: a request used to wait for the whole sync, 5+ minutes, and the n8n node timed out five times in a row)
      - RETRIEVAL_SYNC_WAIT_SECONDS=${RETRIEVAL_SYNC_WAIT_SECONDS:-0}
      # index store: empty = the SQLite file in /data (default); a postgresql:// DSN = PostgreSQL (database retrieval in ahawr-postgres)
      - RETRIEVAL_DATABASE_URL=${RETRIEVAL_DATABASE_URL:-}
      - RETRIEVAL_DATABASE_SCHEMA=${RETRIEVAL_DATABASE_SCHEMA:-retrieval}
      - RETRIEVAL_BOOTSTRAP_CORPORA=${RETRIEVAL_BOOTSTRAP_CORPORA:-ahawr-workspace=/workspace}
      # missions.working_directory (e.g. D:\OpenAIProjects\app) → /d/OpenAIProjects/app
      - RETRIEVAL_PATH_MAP=${AHAWR_WORKSPACE_DIR:-D:\n8n\workspace}=/workspace,${AHAWR_HOST_DRIVE:-D:\}=/d

    # 2026-10-13: the Docker VM hung for lack of memory (swap full, PSI 60%); a runaway indexer must be killed alone, not stall the VM
    # 2026-10-14: 1536m was too little for the working set (ONNX e5 ~0.8 GB + vectors of the 58k-chunk docs corpus ~0.3 GB + request peaks up to 2.7 GB):
    # the container was OOM-killed on the first search of every start (122 restarts). 2560m with fewer malloc arenas; still a hard cap for a runaway indexer.
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
      # Workspace Hermes works in, read-only (set AHAWR_WORKSPACE_DIR in .env).
      - ${AHAWR_WORKSPACE_DIR:-D:\n8n\workspace}:/workspace:ro
      # The drive with the missions' working directories (AHAWR_HOST_DRIVE), read-only.
      - type: bind
        source: ${AHAWR_HOST_DRIVE:-D:\}
        target: /d
        read_only: true
      - ahawr-retrieval-data:/data

    extra_hosts:
      # reranker-service / rag-platform / embedding endpoints running on the host
      - "host.docker.internal:host-gateway"

  # AHAWR v13 — Claude Code: executes Architect/Worker/Reviewer runs with the Claude Code CLI
  # behind a Hermes-compatible /v1/runs API. Built and started with the rest of the stack
  # (`docker compose up -d --build`); idle until AHAWR v13 — Claude Code sends runs.
  # n8n reaches it at http://claude-runner:8700 over the stack network; the port is published on 127.0.0.1 only, for the host QA worker.
  claude-runner:
    build:
      context: ./claude-runner
      dockerfile: Dockerfile
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        EXTRA_APT_PACKAGES: ${CLAUDE_RUNNER_EXTRA_APT_PACKAGES:-}

    container_name: claude-runner
    restart: unless-stopped
    # the host QA worker (data-tables/ops/qa_worker.py) polls the QA request queue here; bound to the loopback only, the API key still applies
    ports:
      - "127.0.0.1:8700:8700"
    # 2026-10-15: there was no limit; Worker python scripts that read the 9 GB GGUF into RAM (anon-rss 7-9 GB, six times in a night) made the kernel of the
    # Docker VM kill processes VM-wide and finally restart the VM. With a cap only the offending process dies inside this container.
    mem_limit: 6g
    memswap_limit: 6g

    # ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN and CLAUDE_RUNNER_* settings. See .env.example.
    env_file:
      - path: .env
        required: false

    environment:
      # search gate (rag-quality, 2026-10-29): ahawr-search returns 'search skipped' when the query is an existing path; 0 = off
      - AHAWR_SEARCH_SKIP_PATH=${AHAWR_SEARCH_SKIP_PATH:-1}
      - CLAUDE_RUNNER_WORKSPACE=/workspace
      - HOST_ACTIONS=${HOST_ACTIONS:-}
      - CLAUDE_RUNNER_HOST_ACTIONS_OPERATOR_KEY=${CLAUDE_RUNNER_HOST_ACTIONS_OPERATOR_KEY:-}
      - CLAUDE_RUNNER_ALLOWED_ROOTS=/workspace,/d
      # a restore point of the tracked changes before every Worker run (git_snapshot.py): refs/ahawr/snapshots/<run_id>
      - CLAUDE_RUNNER_WORKER_GIT_SNAPSHOT=${CLAUDE_RUNNER_WORKER_GIT_SNAPSHOT:-1}
      - CLAUDE_RUNNER_GIT_SNAPSHOT_KEEP=${CLAUDE_RUNNER_GIT_SNAPSHOT_KEEP:-100}
      # provider keys (docs/providers.md, section 10): one encrypted file on a volume shared by the runner and the dashboard;
      # the master key stays in the host .env and is not passed to the Worker (the CLI env drops CLAUDE_RUNNER_*)
      - CLAUDE_RUNNER_PROVIDERS_DB=${CLAUDE_RUNNER_PROVIDERS_DB:-1}
      - CLAUDE_RUNNER_SECRETS_FILE=/secrets/provider-secrets.json
      - CLAUDE_RUNNER_SECRETS_KEY=${CLAUDE_RUNNER_SECRETS_KEY:-}
      # missions.working_directory is a host path (D:\OpenAIProjects\app); it is mapped into the
      # container (/d/OpenAIProjects/app) and Claude Code runs there.
      - CLAUDE_RUNNER_PATH_MAP=${AHAWR_WORKSPACE_DIR:-D:\n8n\workspace}=/workspace,${AHAWR_HOST_DRIVE:-D:\}=/d
      # Before each run of the local provider the runner reads the model's --ctx-size from
      # llama-server (GET /v1/models) and sets Claude Code's window and autocompact trigger to it;
      # the key is the one LiteLLM uses for llama-server. Empty URL = static settings only.
      - CLAUDE_RUNNER_PROVIDER_LOCAL__CONTEXT_PROBE_URL=${LLAMACPP_CONTEXT_PROBE_URL-http://host.docker.internal:8033}
      - CLAUDE_RUNNER_PROVIDER_LOCAL__CONTEXT_PROBE_KEY=${LLAMACPP_API_KEY:-}
      # refuse exploratory grep/rg/find from local Workers until they have used ahawr-search
      - CLAUDE_RUNNER_PROVIDER_LOCAL__SEARCH_FIRST=${AHAWR_SEARCH_FIRST:-1}
      # a task (Worker session) of the local model that has run longer than this gets thinking switched off (the LiteLLM flag file,
      # no restart); back on when the task ends. 0 = never. See claude_runner/think_switch.py
      - CLAUDE_RUNNER_THINK_OFF_AFTER_SECONDS=${AHAWR_THINK_OFF_AFTER_SECONDS:-3600}
      - CLAUDE_RUNNER_THINK_OFF_AFTER_STEPS=${AHAWR_THINK_OFF_AFTER_STEPS:-0}
      - CLAUDE_RUNNER_THINK_FLAG_FILE=/app/runtime/local_thinking
      # policy off_first: the first attempt at a task (TASK T<n>, n >= FROM_TASK) runs without thinking, a retry after a review with it
      - CLAUDE_RUNNER_THINK_POLICY=${AHAWR_THINK_POLICY:-}
      - CLAUDE_RUNNER_THINK_POLICY_FROM_TASK=${AHAWR_THINK_POLICY_FROM_TASK:-1}
      # what a local run would have cost on a cloud model (USD per MTok: input, output, cache read, cache write): steps made without thinking
      # at the Haiku rates, with thinking at the Sonnet rates (claude_runner/local_pricing.py). Empty modes = the flat Claude Code price.
      - CLAUDE_RUNNER_LOCAL_PRICE_SONNET=${AHAWR_LOCAL_PRICE_SONNET:-2,10,0.2,4}
      - CLAUDE_RUNNER_LOCAL_PRICE_HAIKU=${AHAWR_LOCAL_PRICE_HAIKU:-1,5,0.1,1.25}
      - CLAUDE_RUNNER_LOCAL_PRICE_THINKING_OFF=${AHAWR_LOCAL_PRICE_THINKING_OFF:-haiku}
      - CLAUDE_RUNNER_LOCAL_PRICE_THINKING_ON=${AHAWR_LOCAL_PRICE_THINKING_ON:-sonnet}
      # Tool output limits for the local Worker only (Part B): off by default so behavior is
      # unchanged until the operator enables it; when on, only the Worker on the local provider
      # gets BASH_MAX_OUTPUT_LENGTH=12000 and CLAUDE_CODE_FILE_READ_MAX_OUTPUT_TOKENS=16000.
      - CLAUDE_RUNNER_LOCAL_TOOL_OUTPUT_LIMITS=${AHAWR_LOCAL_TOOL_OUTPUT_LIMITS:-0}
      - CLAUDE_RUNNER_LOCAL_SHARED_PREFIX=${AHAWR_LOCAL_SHARED_PREFIX:-1}
      - CLAUDE_RUNNER_MCP_SEARCH=${CLAUDE_RUNNER_MCP_SEARCH:-1}

    volumes:
      # The same workspace the retrieval container indexes; the Worker edits it (read-write).
      - ${AHAWR_WORKSPACE_DIR:-D:\n8n\workspace}:/workspace
      # The drive with the missions' working directories (AHAWR_HOST_DRIVE); the Worker edits there.
      - type: bind
        source: ${AHAWR_HOST_DRIVE:-D:\}
        target: /d
      # Claude Code sessions (transcripts) survive container restarts and rebuilds.
      - claude-runner-home:/home/node/.claude
      - claude-runner-data:/data
      - ahawr-provider-secrets:/secrets
      # the captures of the QA agent (written by ahawr-qa); the qa_agent role reads them (--add-dir /qa-runs)
      - qa-runs:/qa-runs:ro
      # the LiteLLM runtime switches (local_thinking): the runner writes it when a task runs too long
      - ./litellm/runtime:/app/runtime
      # the Worker's scratch folder (missions use /tmp/dcfr-work) survives container recreation
      - type: bind
        source: ${AHAWR_SCRATCH_DIR:-D:\n8n\runner-scratch}
        target: /tmp/dcfr-work
        bind:
          create_host_path: true

    extra_hosts:
      # model endpoints on the host (e.g. ANTHROPIC_BASE_URL=http://host.docker.internal:4000)
      - "host.docker.internal:host-gateway"

    depends_on:
      litellm:
        condition: service_started
        # claude-runner still starts if LiteLLM is down (Claude API used directly).
        required: false

    stop_grace_period: 60s

  # AHAWR QA worker: runs the QA scenarios in its own container (claude-runner/qa/Dockerfile.qa).
  # It polls the runner over the stack network; it publishes no port and gets no host access beyond the mounts below.
  ahawr-qa:
    build:
      context: ./claude-runner
      dockerfile: qa/Dockerfile.qa

    container_name: ahawr-qa
    # not started by a plain `up`: switch the QA over from the host worker first (docs/qa-container.md)
    profiles: ["qa-container"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      # exec: the regression tests write small wrapper scripts into their temp folder and run them
      - /tmp:exec
      - /home/node

    # memory and CPU caps of the QA run; a runaway scenario is killed alone
    mem_limit: ${AHAWR_QA_MEM_LIMIT:-4g}
    memswap_limit: ${AHAWR_QA_MEM_LIMIT:-4g}
    cpus: ${AHAWR_QA_CPUS:-2}

    environment:
      - CLAUDE_RUNNER_URL=http://claude-runner:8700
      - CLAUDE_RUNNER_API_KEY=${CLAUDE_RUNNER_API_KEY:-}
      # the QA data (scenarios, fixtures, baselines) lives in the repository next to the source: run the QA code from the read-only mount,
      # not from the installed copy in the image (its qa/ folder is not there), so the checked tree is the one that is tested
      - PYTHONPATH=/d/n8n/claude-runner/src
      - QA_RUNS_DIR=/qa-runs
      # the repository is mounted read-only: tool caches and bytecode go to /tmp
      - PYTHONDONTWRITEBYTECODE=1
      - MYPY_CACHE_DIR=/tmp/mypy_cache
      - RUFF_CACHE_DIR=/tmp/ruff_cache
      # every QA stack gets its own database on the throwaway server qa-postgres: no Docker access needed
      - QA_STACK_MODE=postgres
      - QA_PG_HOST=qa-postgres
      - QA_PG_PASSWORD=${QA_PG_PASSWORD:?set QA_PG_PASSWORD in .env for the qa-container profile}
      - CLAUDE_RUNNER_PATH_MAP=${AHAWR_WORKSPACE_DIR:-D:\n8n\workspace}=/workspace,${AHAWR_HOST_DRIVE:-D:\}=/d

    volumes:
      # the repository and the missions' working directories, read-only (the same mapping as claude-runner)
      - type: bind
        source: ${AHAWR_HOST_DRIVE:-D:\}
        target: /d
        read_only: true
      - ${AHAWR_WORKSPACE_DIR:-D:\n8n\workspace}:/workspace:ro
      # the QA worker heartbeat directory only; under /d so the default QA_WORKER_HEARTBEAT_PATH maps onto it
      - type: bind
        source: D:\n8n\data-tables\ops\heartbeat
        target: /d/n8n/data-tables/ops/heartbeat
        bind:
          create_host_path: true
      # the regression baselines are written here, the only writable place of the repository
      - type: bind
        source: ./claude-runner/qa/baselines
        target: /d/n8n/claude-runner/qa/baselines
        bind:
          create_host_path: true
      # verdicts, screenshots and logs of the QA runs
      - qa-runs:/qa-runs

    depends_on:
      claude-runner:
        condition: service_started
      qa-postgres:
        condition: service_healthy

  # Throwaway Postgres for the QA stacks (databases qa_<id> are created and dropped by the QA worker).
  # No port is published, no volume: its data lives in memory and is gone with the container.
  qa-postgres:
    image: postgres:16-alpine
    container_name: qa-postgres
    profiles: ["qa-container"]
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - POSTGRES_USER=qa
      - POSTGRES_PASSWORD=${QA_PG_PASSWORD:?set QA_PG_PASSWORD in .env for the qa-container profile}
      - POSTGRES_DB=qa_admin
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U qa -d qa_admin"]
      interval: 5s
      timeout: 3s
      retries: 10

  # AHAWR dashboard: http://localhost:8701 (127.0.0.1 only, read-only). Every agent run with its
  # thinking, tool calls and results, steps, timings and tokens: Claude Code runs from
  # claude-runner and Hermes sessions from the Hermes API server (HERMES_API_URL/HERMES_API_KEY).
  # Its own container, so the Hermes key never reaches claude-runner, where the Worker runs commands.
  ahawr-dashboard:
    build:
      context: ./claude-runner
      dockerfile: Dockerfile
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        EXTRA_APT_PACKAGES: ${CLAUDE_RUNNER_EXTRA_APT_PACKAGES:-}

    container_name: ahawr-dashboard
    restart: unless-stopped
    command: ["ahawr-dashboard", "--host", "0.0.0.0", "--port", "8701"]

    ports:
      - "127.0.0.1:${AHAWR_DASHBOARD_PORT:-8701}:8701"

    # Only what the dashboard needs (not the whole .env).
    environment:
      - DASHBOARD_RUNNER_URL=http://claude-runner:8700
      - DASHBOARD_BOARD_PG_DSN=${DASHBOARD_BOARD_PG_DSN:-}
      # provider keys (docs/providers.md, section 10): one encrypted file on a volume shared by the runner and the dashboard;
      # the master key stays in the host .env and is not passed to the Worker (the CLI env drops CLAUDE_RUNNER_*)
      - CLAUDE_RUNNER_PROVIDERS_DB=${CLAUDE_RUNNER_PROVIDERS_DB:-1}
      - CLAUDE_RUNNER_SECRETS_FILE=/secrets/provider-secrets.json
      - CLAUDE_RUNNER_SECRETS_KEY=${CLAUDE_RUNNER_SECRETS_KEY:-}
      - DASHBOARD_RUNNER_API_KEY=${CLAUDE_RUNNER_API_KEY:-}
      - CLAUDE_RUNNER_HOST_ACTIONS_OPERATOR_KEY=${CLAUDE_RUNNER_HOST_ACTIONS_OPERATOR_KEY:-}
      # Empty HERMES_API_URL= turns the Hermes source off.
      - DASHBOARD_HERMES_URL=${HERMES_API_URL-http://host.docker.internal:8642}
      - DASHBOARD_HERMES_API_KEY=${HERMES_API_KEY:-}
      # Hermes sessions started through its API (AHAWR); empty = all sessions (Telegram, CLI, ...).
      - DASHBOARD_HERMES_SOURCE=${HERMES_SESSION_SOURCE-api_server}
      - DASHBOARD_GUARDS=${DASHBOARD_GUARDS:-0}
      - DASHBOARD_GUARDS_DRY_RUN=${DASHBOARD_GUARDS_DRY_RUN:-1}
      - DASHBOARD_GUARDS_MISSION_NOTICE_ENABLED=${DASHBOARD_GUARDS_MISSION_NOTICE_ENABLED:-0}
      - DASHBOARD_GUARDS_IDLE_ENABLED=${DASHBOARD_GUARDS_IDLE_ENABLED:-0}
      - DASHBOARD_GUARDS_QUEUE_RESTART_ENABLED=${DASHBOARD_GUARDS_QUEUE_RESTART_ENABLED:-0}
      - DASHBOARD_GUARDS_HOST_HEARTBEAT_ENABLED=${DASHBOARD_GUARDS_HOST_HEARTBEAT_ENABLED:-0}
      - DASHBOARD_GUARDS_TG_RELAY_ENABLED=${DASHBOARD_GUARDS_TG_RELAY_ENABLED:-0}
      - DASHBOARD_GUARDS_TAB=${DASHBOARD_GUARDS_TAB:-0}
      - DASHBOARD_GUARDS_EDIT=${DASHBOARD_GUARDS_EDIT:-0}
      - DASHBOARD_GUARDS_STATE_DIR=/guards/state
      - DASHBOARD_GUARDS_HEARTBEAT_DIR=/guards/heartbeat
      - DASHBOARD_GUARDS_QUEUE_REQUEST_DIR=/guards/requests
      - DASHBOARD_GUARDS_QUEUE_STATE_PATH=/guards/state/queue_seen.json
      - DASHBOARD_GUARDS_TG_OFFSET_PATH=/guards/state/tg_relay.offset
      - DASHBOARD_GUARDS_TG_WEBHOOK_URL=http://n8n-autonomous-agents:5678/webhook/${AHAWR_TG_WEBHOOK_PATH:-}
      # Telegram token and chat id for the guards; the values stay in the host .env
      - DASHBOARD_TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DASHBOARD_TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}

    volumes:
      # heartbeat files of the host watchers, read-only
      - type: bind
        source: D:\n8n\data-tables\ops\heartbeat
        target: /guards/heartbeat
        read_only: true
        bind:
          create_host_path: true
      # restart requests written by the container, read by the host queue launcher
      - type: bind
        source: D:\n8n\data-tables\ops\guard_requests
        target: /guards/requests
        bind:
          create_host_path: true
      # seen-state of the queue notices and the Telegram relay offset
      - ahawr-guards-state:/guards/state
      - ahawr-provider-secrets:/secrets
    extra_hosts:
      # the Hermes API server on the Docker host
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8701/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

    depends_on:
      claude-runner:
        condition: service_started
        required: false

  # LiteLLM: lets Claude Code (Anthropic Messages API) use a local llama.cpp server
  # (OpenAI-compatible). Built and started with the rest of the stack; used only when
  # ANTHROPIC_BASE_URL=http://litellm:4000 is set for claude-runner.
  # claude-runner reaches it at http://litellm:4000; no port is published.
  litellm:
    build:
      context: ./litellm
      dockerfile: Dockerfile
      args:
        LITELLM_VERSION: ${LITELLM_VERSION:-1.102.1}

    container_name: ahawr-litellm
    restart: unless-stopped

    # Only the variables LiteLLM needs (not the whole .env).
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-ahawr-local-change-me}
      - LLAMACPP_API_BASE=${LLAMACPP_API_BASE:-http://host.docker.internal:8080/v1}
      - LLAMACPP_API_KEY=${LLAMACPP_API_KEY:-none}
      # used only by the optional Claude / OpenRouter entries in litellm/config.yaml
      - ANTHROPIC_API_KEY=${LITELLM_ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # 1 = drop the thinking of earlier steps from the context of local models (ahawr_hooks.drop_history_thinking)
      - AHAWR_DROP_HISTORY_THINKING=${AHAWR_DROP_HISTORY_THINKING:-0}
      - AHAWR_CACHE_TRACE=${AHAWR_CACHE_TRACE:-1}
      # 1 = a compaction request of a local model never thinks (the 3000-token cap went to reasoning, the summary was empty)
      - AHAWR_COMPACTION_THINKING_OFF=${AHAWR_COMPACTION_THINKING_OFF:-1}

    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/ahawr_hooks.py:/app/ahawr_hooks.py:ro
      - ./litellm/think_leak_guard.py:/app/think_leak_guard.py:ro
      # prompt-cache diagnostics (AHAWR_CACHE_TRACE=1): one JSON line per local-model request in litellm/trace/cache_trace.jsonl
      - ./litellm/cache_trace.py:/app/cache_trace.py:ro
      - ./litellm/trace:/app/trace
      # runtime switches read on every request (no restart): local_thinking = on | off (set_local_thinking.sh)
      - ./litellm/runtime:/app/runtime:ro

    extra_hosts:
      # llama-server running on the Docker host
      - "host.docker.internal:host-gateway"

volumes:
  ahawr-postgres-data:
  ahawr-retrieval-data:
  claude-runner-home:
  claude-runner-data:
  ahawr-guards-state:
  ahawr-provider-secrets:
  qa-runs:
