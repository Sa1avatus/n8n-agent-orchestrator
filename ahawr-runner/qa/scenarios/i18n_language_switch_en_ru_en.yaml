name: language switch en to ru and back changes tabs and panel text
tags: [ui, i18n, nightly]
preconditions:
  fixture: default
steps:
  - open: /static/board.html#board/view/lane
    expect:
      text_visible: [Lanes, "A row is a mission."]
      request_2xx: [/api/board]
      no_console_error: true
  - switch_language: ru
    expect:
      text_visible: ["Дорожки", "Строка — миссия"]
      no_console_error: true
  - switch_language: en
    expect:
      text_visible: [Lanes, "A row is a mission."]
      no_console_error: true
