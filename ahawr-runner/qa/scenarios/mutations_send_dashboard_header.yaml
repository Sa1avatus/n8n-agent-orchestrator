name: queue mutations send the dashboard header and survive a reload
tags: [ui, queue, nightly]
preconditions:
  fixture: default
steps:
  - open: /static/board.html#board/view/kan
    expect:
      order: [Never started, Queued with status, Waiting in line]
  - drag:
      from: Waiting in line
      onto: Never started
    expect:
      order: [Waiting in line, Never started, Queued with status]
      request_2xx: [/api/board/queue/move]
      no_console_error: true
      no_mutation_without_header: true
  - drag:
      from: Queued with status
      onto: Waiting in line
    expect:
      order: [Queued with status, Waiting in line, Never started]
      request_2xx: [/api/board/queue/move]
      no_console_error: true
      no_mutation_without_header: true
reload_persistence: true
