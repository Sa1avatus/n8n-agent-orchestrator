[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ahawr-retrieval"
version = "0.1.0"
description = "Context Retrieval Layer for AHAWR Worker and Reviewer roles"
requires-python = ">=3.11"
# Core runtime installed into the n8n image (Execute Command mode): no web server needed.
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Optional standalone HTTP API (`ahawr-retrieval serve`), used for development and tests.
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "pytest>=8,<10", "pytest-cov>=5,<8", "respx>=0.21,<1", "ruff>=0.6", "mypy>=1.10",
]

[project.scripts]
ahawr-retrieval = "ahawr_retrieval.cli:main"
ahawr-retrieval-eval = "ahawr_retrieval.eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ahawr_retrieval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=ahawr_retrieval --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["respx", "respx.*"]
ignore_missing_imports = true
